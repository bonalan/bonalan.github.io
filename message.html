<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Birthday Chico!</title>
  <!-- Load the p5.js library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.1/p5.min.js"></script>
  <style>
    body {
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background-color: #f5f5f5;
      font-family: Arial, sans-serif;
    }
    
    #canvasContainer {
      margin: 20px;
      box-shadow: 0px 0px 15px rgba(0,0,0,0.2);
    }
    
    .controls {
      margin-top: 20px;
      background-color: rgba(255,255,255,0.8);
      padding: 15px;
      border-radius: 8px;
      box-shadow: 0px 0px 10px rgba(0,0,0,0.1);
      text-align: center;
    }
    
    button {
      margin: 5px;
      padding: 8px 16px;
      background-color: #4169E1;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      transition: background-color 0.3s;
    }
    
    button:hover {
      background-color: #3151B5;
    }
    
    h1 {
      color: #4169E1;
      margin-bottom: 10px;
    }
    
    p {
      color: #666;
      margin-top: 5px;
    }
  </style>
</head>
<body>
  <h1>Happy Birthday Chico!</h1>
  <p>Move your mouse over the canvas to control the animation</p>
  <div id="canvasContainer"></div>
  <div class="controls">
    <div>Animation Styles:</div>
    <button onclick="changeDrawMode(1)">Style 1: Lines</button>
    <button onclick="changeDrawMode(2)">Style 2: Ellipses</button>
    <button onclick="changeDrawMode(3)">Style 3: Triangles</button>
    <button onclick="changeDrawMode(4)">Style 4: Points</button>
    <button onclick="savePNG()">Save as Image</button>
  </div>

  <script>
    // Animation variables
    let textTyped = 'HAPPY BDAY CHICO!';
    let drawMode = 1;
    let fontSize = 150;
    let padding = 10;
    let nOff = 0;
    let pointDensity = 8;
    let colors;
    let textImg;
    let cnv;

    function setup() {
      // Create canvas and place it in the container
      cnv = createCanvas(800, 400);
      cnv.parent('canvasContainer');
      
      frameRate(25);
      rectMode(CENTER);
      
      // Define color palette
      colors = [
        color(65, 105, 185),  // Blue
        color(245, 95, 80),   // Red
        color(15, 233, 118)   // Green
      ];
      
      // Create text graphic
      setupText();
    }

    function setupText() {
      // Create an offscreen graphics object to draw the text into
      textImg = createGraphics(width, height);
      textImg.pixelDensity(1);
      textImg.background(255);
      textImg.textAlign(CENTER, CENTER);
      textImg.textSize(fontSize);
      textImg.fill(0);
      textImg.text(textTyped, width/2, height/2);
      textImg.loadPixels();
    }

    function draw() {
      background(255);
      nOff++;
      
      // Loop through the pixels of the text image
      for (let x = 0; x < width; x += pointDensity) {
        for (let y = 0; y < height; y += pointDensity) {
          // Calculate the index for the pixels array
          const index = (x + y * width) * 4;
          // Get the red value from image
          const r = textImg.pixels[index];
          
          // If this pixel is part of the text (dark)
          if (r < 128) {
            // Different drawing modes
            if (drawMode == 1) {
              strokeWeight(1);
              
              // Use mouse position for variation
              const noiseFac = map(mouseX, 0, width, 0, 1);
              const lengthFac = map(mouseY, 0, height, 0.01, 1);
              
              // Apply different colors based on noise
              const num = noise((x + nOff) * noiseFac * 0.01, y * noiseFac * 0.01);
              if (num < 0.6) {
                stroke(colors[0]);
              } else if (num < 0.7) {
                stroke(colors[1]);
              } else {
                stroke(colors[2]);
              }
              
              push();
              translate(x, y);
              rotate(radians(frameCount));
              line(0, 0, fontSize * lengthFac * 0.1, 0);
              pop();
            }
            
            else if (drawMode == 2) {
              noStroke();
              push();
              translate(x, y);
              
              const num = noise((x + nOff) / 10, y / 10);
              
              if (num < 0.6) {
                fill(colors[0]);
              } else if (num < 0.7) {
                fill(colors[1]);
              } else {
                fill(colors[2]);
              }
              
              const w = noise((x - nOff) / 10, (y + nOff * 0.1) / 10) * 20;
              const h = noise((x - nOff) / 10, (y + nOff * 0.1) / 10) * 10;
              ellipse(0, 0, w, h);
              pop();
            }
            
            else if (drawMode == 3) {
              noStroke();
              
              const num = random(1);
              
              if (num < 0.6) {
                fill(colors[0]);
              } else if (num < 0.7) {
                fill(colors[1]);
              } else {
                fill(colors[2]);
              }
              
              push();
              beginShape();
              for (let i = 0; i < 3; i++) {
                const ox = (noise((i * 1000 + x - nOff) / 30, (i * 3000 + y + nOff) / 30) - 0.5) * pointDensity * 6;
                const oy = (noise((i * 2000 + x - nOff) / 30, (i * 4000 + y + nOff) / 30) - 0.5) * pointDensity * 6;
                vertex(x + ox, y + oy);
              }
              endShape(CLOSE);
              pop();
            }
            
            else if (drawMode == 4) {
              stroke(colors[0]);
              strokeWeight(3);
              
              point(x - 10, y - 10);
              point(x, y);
              point(x + 10, y + 10);
              
              for (let i = 0; i < 5; i++) {
                if (i == 1) {
                  stroke(colors[1]);
                } else if (i == 3) {
                  stroke(colors[2]);
                }
                
                if (i % 2 == 0) {
                  const ox = noise((10000 + i * 100 + x - nOff) / 10) * 10;
                  const oy = noise((20000 + i * 100 + x - nOff) / 10) * 10;
                  point(x + ox, y + oy);
                } else {
                  const ox = noise((30000 + i * 100 + x - nOff) / 10) * 10;
                  const oy = noise((40000 + i * 100 + x - nOff) / 10) * 10;
                  point(x - ox, y - oy);
                }
              }
            }
          }
        }
      }
    }

    // Change the drawing mode
    function changeDrawMode(mode) {
      drawMode = mode;
    }
    
    // Save the canvas as a PNG
    function savePNG() {
      saveCanvas(cnv, 'HappyBirthdayChico', 'png');
    }

    // Handle key interactions
    function keyPressed() {
      if (key >= '1' && key <= '4') {
        drawMode = parseInt(key);
      }
    }
  </script>
</body>
</html>
